name: WP.org Deploy

on:
  push:
    branches:
      - develop
  release:
    types:
      - published

permissions:
  contents: write

jobs:

  # Full test and lint matrix only for actual releases; the readme-only
  # trunk syncs on develop pushes run without it.
  test:
    name: Test and Lint
    if: github.event_name == 'release'
    uses: ./.github/workflows/test.yml

  deploy-release:
    name: Deploy Release
    needs: test
    runs-on: ubuntu-24.04
    concurrency:
      group: wporg-deploy
      cancel-in-progress: false
    # Stable releases deploy exactly the files of the release ZIP to
    # tags/<version> and update the assets. Trunk is never synced from the
    # release anymore. Pre-releases only build tags/<version> directly from
    # the ZIP: trunk keeps serving the stable version.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2

      # GitHub's Ubuntu runners don't include the svn client that
      # wp-release needs to deploy.
      - name: Install Subversion
        run: |
          if command -v svn >/dev/null 2>&1; then
            echo "Subversion is already installed."
          else
            sudo apt-get update --quiet
            sudo apt-get install --yes --quiet --no-install-recommends subversion
          fi

      - name: Install NPM dependencies
        run: npm install

      - name: Build the plugin
        run: npm run build

      # Packages dist into the release ZIP with the checksums manifest
      # (WordPress.org plugin-checksums API format) embedded at the package
      # root — the manifest name and embedding come from the `integrity`
      # settings of wp-release.config.mjs. No signing key is used yet.
      - name: Package the release ZIP with embedded checksums
        run: npm run zip

      # Attach the ZIP to the GitHub release (pre-releases included). The
      # checksums manifest is embedded in the ZIP itself, so no extra
      # manifest asset is needed.
      - name: Attach the ZIP to the release
        run: gh release upload "$GITHUB_REF_NAME" widget-context.*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # Stable releases: deploy exactly the files of the release ZIP to
      # tags/<version> and update the assets.
      - name: Deploy stable release to WordPress.org
        if: ! github.event.release.prerelease
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: npx wp-release deploy-svn --from-zip widget-context.*.zip --slug widget-context --svn-tag "$GITHUB_REF_NAME" --assets-dir assets/wporg

      # Pre-releases: build tags/<version> from the release ZIP and leave
      # trunk and the assets alone. A leading "v" in the tag name is
      # stripped.
      - name: Deploy pre-release to WordPress.org
        if: github.event.release.prerelease
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: npx wp-release deploy-svn --from-zip widget-context.*.zip --slug widget-context --svn-tag "$GITHUB_REF_NAME"

  # develop pushes: update the wp.org readme without tagging, for changes
  # between releases such as bumping "Tested up to" or readme changelog
  # entries. Nothing else on wp.org (trunk, tags) is touched on a push, so
  # the pre-release zips built above stay the deploy source of record.
  readme-trunk:
    name: Update the WordPress.org readme
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    concurrency:
      group: wporg-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2

      # GitHub's Ubuntu runners don't include the svn client that
      # wp-release needs to deploy.
      - name: Install Subversion
        run: |
          if command -v svn >/dev/null 2>&1; then
            echo "Subversion is already installed."
          else
            sudo apt-get update --quiet
            sudo apt-get install --yes --quiet --no-install-recommends subversion
          fi

      - name: Install NPM dependencies
        run: npm install

      - name: Build the plugin
        run: npm run build

      - name: Update the WordPress.org readme
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: npx wp-release deploy-svn dist --slug widget-context --readme-only
