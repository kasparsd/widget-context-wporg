name: WP.org Deploy

on:
  push:
    branches: [ develop ]
    tags: [ '*' ]

permissions:
  contents: read

env:
  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

jobs:

  build:
    name: Build
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: Install tooling
        run: npm install

      - name: Build the plugin
        run: npm run build

      - name: Deploy the full build as a new release
        if: github.ref_type == 'tag'
        uses: wpelevator/wp-release-deploy-svn@0.1.1
        with:
          source-dir: dist
          slug: widget-context
          trunk: true
          svn-tag: ${{ github.ref_name }}
          force: true
          assets-dir: assets/wporg
          exclude: |
            composer.json

      - name: Update the readme between releases
        if: github.ref_type == 'branch'
        uses: wpelevator/wp-release-deploy-svn@0.1.1
        with:
          source-dir: dist
          slug: widget-context
          readme-only: true
          assets-dir: assets/wporg
