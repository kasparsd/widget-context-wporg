name: WP.org Deploy

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:

  test:
    name: Test and Lint
    uses: ./.github/workflows/test.yml

  deploy:
    name: Build and Deploy
    needs: test
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy
      cancel-in-progress: false
    # Stable releases sync trunk, tag it and update the assets. Pre-releases
    # can't be tagged on WordPress.org (the action rejects pre-release tags
    # and trunk must keep serving the stable version), so they only sync
    # the assets.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: Install tooling
        run: npm install

      - name: Build the plugin
        run: npm run build

      - name: Deploy the stable release to WordPress.org
        if: ${{ ! github.event.release.prerelease }}
        uses: wpelevator/wp-release-deploy-svn@0.2.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        with:
          svn-tag: ${{ github.ref_name }}
          source-dir: dist
          slug: widget-context
          assets-dir: assets/wporg
          trunk: true
          force: true

      - name: Sync the assets for a pre-release
        if: ${{ github.event.release.prerelease }}
        uses: wpelevator/wp-release-deploy-svn@0.2.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        with:
          source-dir: dist
          slug: widget-context
          assets-dir: assets/wporg

