name: Lint and Test

on:
  # Restrict push triggers to trunk branches so pull request branches
  # (which also trigger `pull_request` below) don't run the jobs twice.
  push:
    branches:
      - develop
      - master
  pull_request:
  workflow_call:

jobs:

  test:
    name: Test and Lint
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php-versions:
          - 7.4
          - 8.0
          - 8.1
          - 8.2
          - 8.3
          - 8.4
          - 8.5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: xdebug

      - name: Install tooling
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: composer test

      - name: Check mess
        run: npm run mess -- -- --ignore-violations-on-exit

      - name: Build
        run: npm run build

  # Sanity check: the release packaging must produce a ZIP with the
  # checksums manifest embedded (WordPress.org plugin-checksums API
  # format), and the version sources in the build must agree. Unsigned on
  # purpose: only genuine releases consume signing keys.
  zip:
    name: Zip smoke test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: Install tooling
        run: npm install

      - name: Build
        run: npm run build

      - name: Zip
        run: npm run zip

      - name: Verify the embedded checksums manifest
        run: unzip -l widget-context.*.zip | grep 'widget-context/checksums.json'

      - name: Check the package versions
        run: npx wp-release version-check dist

  # A pull request that changes the package needs a changeset, either with
  # a release note or an empty one for an explicit no-release decision.
  changeset:
    name: Check the changeset
    # Automated release PRs (branches starting with `release/`) consume
    # their pending changesets by design, so a newly added changeset can
    # never satisfy the gate.
    if: github.event_name == 'pull_request' && ! startsWith( github.head_ref, 'release/' )
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The comparison needs the base branch history.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Install tooling
        run: npm install

      - name: Changeset status
        run: npx wp-release changeset-status --since "origin/${{ github.base_ref }}"
